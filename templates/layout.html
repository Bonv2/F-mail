<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mail{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row vh-100">

        <!-- Sidebar -->
        <div class="col-2 bg-dark text-white p-3">
            <h4>📧 F-mail</h4>

            <a href="/inbox" class="d-block text-white mb-2">📥 Входящие</a>
            <a href="/send" class="d-block text-white mb-2">✍️ Написать</a>
            <a href="/logout" class="d-block text-danger mt-3">🚪 Выйти</a>
        </div>

        <!-- Content -->
        <div class="col-10 p-4 overflow-auto">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>

</body>
</html>
