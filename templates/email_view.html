{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-body p-5">

        <h2 class="mb-4">
            {{ email.title }}
        </h2>

        <p>
            <strong>От:</strong>
            {{ email.sender_username }}
        </p>

        <p>
            <strong>Кому:</strong>
            {{ email.receiver_username }}
        </p>

        <hr>

        <div class="mb-4" style="white-space: pre-line;">
            {{ email.contents }}
        </div>

        <a href="/compose?receiver={{ email.sender_username }}&title={{ email.title }}"
           class="btn btn-success">
            Ответить
        </a>

        <a href="/mailbox"
           class="btn btn-outline-secondary">
            Назад
        </a>

    </div>
</div>

{% endblock %}
