{% extends "layout.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h4>{{ mail.title }}</h4>

        <p class="text-muted">
            От: {{ mail.sender_username }} → {{ mail.receiver_username }}
        </p>

        <hr>

        <p style="white-space: pre-line;">
            {{ mail.contents }}
        </p>

        <a href="/inbox" class="btn btn-secondary mt-3">Назад</a>

    </div>
</div>

{% endblock %}
